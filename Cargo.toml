[workspace]
members = ["crates/app-server", "crates/relay", "crates/scope", "crates/mcp", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Connect ChatGPT to your host workspace and Codex CLI through the official Codex App Server"
readme = "README.md"
repository = "https://github.com/Jesrey0/codex-connect"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.23"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
