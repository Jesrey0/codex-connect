name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Codex CLI
        run: npm install --global "@openai/codex@$(cat config/codex-cli-pin)"
      - name: Install protocol test dependencies
        run: python -m pip install jsonschema
      - name: Check pinned App Server schemas
        run: ./scripts/generate-app-server-tool-schemas.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: cargo check --locked
      - name: Build protocol integration fixture
        run: cargo build --locked -p codex-connect
      - name: Run protocol integration suite
        run: python tests/protocol_integration.py
