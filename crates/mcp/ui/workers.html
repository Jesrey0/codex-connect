--><style>:root {
  color-scheme: light dark;
  --bg:#f5f7fa;
  --surface:#fff;
  --text:#182332;
  --muted:#536477;
  --line:#dce3eb;
  --accent:#08776e;
  --tint:#e9f6f2;
  --danger:#a52d36;
  --attention:#765211;
  font-family: var(--font-sans,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif);
  font-size: 14px;
  line-height: 1.5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg:#12171f;
    --surface:#1a222d;
    --text:#e6ecf4;
    --muted:#a1b0c2;
    --line:#334154;
    --accent:#66dec8;
    --tint:#1c3836;
    --danger:#ffabb3;
    --attention:#edcb88;
  }
}
:root[data-theme=dark] {
  --bg:#12171f;
  --surface:#1a222d;
  --text:#e6ecf4;
  --muted:#a1b0c2;
  --line:#334154;
  --accent:#66dec8;
  --tint:#1c3836;
  --danger:#ffabb3;
  --attention:#edcb88;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}
button,
select {
  font: inherit;
  color: inherit;
}
button,
select,
summary {
  cursor: var(--cursor-interaction,pointer);
}
button {
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  padding: 8px 12px;
  font-weight: 600;
}
button:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--tint);
}
button:disabled {
  opacity: .5;
  cursor: default;
}
button:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 3px;
}
.primary {
  color: var(--bg);
  background: var(--accent);
  border-color: var(--accent);
}
.primary:hover:not(:disabled) {
  color: var(--text);
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 26px;
  letter-spacing: -.7px;
}
h2 {
  font-size: 18px;
  line-height: 1.4;
}
h3 {
  font-size: 14px;
}
p {
  margin-top: 8px;
}
.shell {
  max-width: 1440px;
  margin: auto;
  padding: 20px;
}
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.eyebrow {
  font-size: 10px;
  letter-spacing: 1.5px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 4px;
}
.runtime {
  font-size: 12px;
  color: var(--accent);
}
.muted {
  color: var(--muted);
  font-size: 12px;
}
.snapshot-time {
  margin-top: 3px;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  margin-top: 20px;
}
.filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}
.control {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  color: var(--muted);
}
select {
  background: var(--surface);
  width: 100%;
  padding: 9px 7px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
}
.count {
  margin: 12px 0;
}
.project-group {
  margin: 20px 0;
}
.project-title {
  font: 600 11px var(--font-mono,ui-monospace,monospace);
  color: var(--muted);
  overflow-wrap: anywhere;
  margin-bottom: 10px;
}
.worker {
  display: flex;
  flex-direction: column;
  gap: 7px;
  text-align: left;
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  min-width: 0;
  box-shadow: 0 2px 8px #00000006;
}
.worker[aria-pressed=true] {
  border-color: var(--accent);
  background: var(--tint);
}
.badge {
  display: inline-block;
  align-self: flex-start;
  font-size: 10px;
  font-weight: 650;
  border: 1px solid var(--line);
  padding: 2px 7px;
  border-radius: 5px;
  color: var(--muted);
  width: max-content;
}
.badge.inProgress {
  color: var(--accent);
  border-color: var(--accent);
}
.badge.failed,
.error {
  color: var(--danger);
}
.task {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  font-size: 14px;
  font-weight: 650;
}
.activity {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
}
.worker-meta {
  font-size: 10px;
  font-weight: 400;
  overflow-wrap: anywhere;
}
.details {
  min-width: 0;
}
.details > h2 {
  overflow-wrap: anywhere;
  margin: 8px 0 12px;
}
.details > .badge {
  margin-bottom: 10px;
}
.metadata {
  display: grid;
  grid-template-columns: 85px minmax(0, 1fr);
  gap: 8px 10px;
  font-size: 12px;
  margin: 14px 0 22px;
}
.metadata dt {
  color: var(--muted);
}
.metadata dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.card {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  padding: 15px;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
.attention {
  border-color: var(--attention);
}
.attention > h3 {
  color: var(--attention);
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--font-mono,ui-monospace,monospace);
  font-size: 12px;
  line-height: 1.65;
  margin: 14px 0 0;
}
details {
  margin: 10px 0;
}
summary {
  font-size: 12px;
  color: var(--muted);
}
.result-label {
  font-size: 11px;
  color: var(--accent);
}
.paging {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 12px;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 22px;
}
.footnote {
  font-size: 11px;
}
.message {
  padding: 11px 13px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--surface);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.empty,
.intro {
  padding: 30px 14px;
  text-align: center;
  color: var(--muted);
}
.empty h2,
.intro h2 {
  color: var(--text);
}
.intro-icon {
  font-size: 30px;
  color: var(--accent);
  margin-bottom: 14px;
}
.intro {
  max-width: 360px;
  margin: 0 auto;
}
.back {
  padding: 4px 0;
  background: transparent;
  border: 0;
  color: var(--accent);
  margin-bottom: 18px;
  font-size: 12px;
}
.selected .worker-list {
  display: none;
}
@media (min-width: 850px) {
  .workspace {
    grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
  }
  .selected .worker-list {
    display: block;
  }
  .back {
    display: none;
  }
  .intro {
    align-self: center;
  }
  .details {
    border-left: 1px solid var(--line);
    padding-left: 24px;
  }
  .shell {
    padding: 24px 28px;
  }
}
@media (max-width: 360px) {
  .shell {
    padding: 14px;
  }
  .filters {
    grid-template-columns: minmax(0, 1fr);
  }
  .metadata {
    grid-template-columns: 65px minmax(0, 1fr);
  }
  .actions button {
    width: 100%;
  }
}
